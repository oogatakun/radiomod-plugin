plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = mod_group_id
version = mod_version
base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

jarJar.enable()

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.lavalink.dev/releases' }
    maven { url = 'https://maven.lavalink.dev/snapshots' }
}

// 音声の取得・デコードに使うライブラリ。jar-in-jar で mod の jar に同梱する。
// Minecraft 本体が持っているライブラリは重複させないため除く。
configurations {
    audioLibs {
        canBeConsumed = false
        exclude group: 'org.slf4j'
        exclude group: 'org.apache.httpcomponents'
        exclude group: 'commons-io'
        exclude group: 'commons-codec'
        exclude group: 'commons-logging'
        exclude group: 'org.jetbrains', module: 'annotations'
        // Rhino 本体(org.mozilla:rhino)は同梱しない。WorldEdit など、Rhino 本体のクラスを自分の jar に持つ mod と
        // 同じパッケージが重なり、起動時に「Modules org.mozilla.rhino and worldedit export package ...」で落ちるため。
        // YouTube が使う rhino-engine(org.mozilla.javascript.engine)は WorldEdit にないので、これは同梱する。
        // 本体は WorldEdit などのものを使う。Rhino 本体を持つ mod が入っていないと、YouTube は使えない(mp3・ラジオは使える)。
        exclude group: 'org.mozilla', module: 'rhino'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    audioLibs 'dev.arbjerg:lavaplayer:2.2.7'
    // 正式版 1.18.2 は IOS・ANDROID が 400 で、WEB は署名の解読に失敗する。2026-09-17 の開発版（コミット固定）で IOS・ANDROID が通る。
    audioLibs 'dev.lavalink.youtube:common:2be8e542d3f6f178e048dca565892684c2e40177-SNAPSHOT'
    compileOnly files({ configurations.audioLibs.files })
    testImplementation files({ configurations.audioLibs.files })

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// audioLibs の解決結果を、固定した版のまま jar-in-jar に載せる。
afterEvaluate {
    configurations.audioLibs.resolvedConfiguration.resolvedArtifacts.each { a ->
        def id = a.moduleVersion.id
        dependencies.jarJar(group: id.group, name: id.name, version: "[${id.version}]") {
            transitive = false
            jarJar.pin(it, id.version)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    jvmArgs '-Dfile.encoding=UTF-8'
}

processResources {
    def props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_authors: mod_authors]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/mods.toml') {
        expand props
    }
}

// 配布するのは jar-in-jar 入りの jar（クラス名に -all が付く既定を外す）。
jar {
    archiveClassifier = 'slim'
}

tasks.named('jarJar') {
    archiveClassifier = ''
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors
        ])
    }
}
